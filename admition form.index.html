<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission Form - Nova College</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <!-- Admission Section -->
  <section class="form-container">
    <div class="form-card">
      <div class="form-header">
        <h2>Nova College Admission Form</h2>
        <p>Please fill out the form carefully to submit your application.</p>
      </div>

      <form id="admissionForm">
        <!-- Personal Details -->
        <div class="form-group-title">Personal Information</div>
        <div class="form-grid">
          <div class="input-box">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>
          </div>

          <div class="input-box">
            <label for="fatherName">Father / Guardian Name *</label>
            <input type="text" id="fatherName" placeholder="Enter father's name" required>
          </div>

          <div class="input-box">
            <label for="email">Email Address *</label>
            <input type="email" id="email" placeholder="example@email.com" required>
          </div>

          <div class="input-box">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" placeholder="03XXXXXXXXX" required>
          </div>

          <div class="input-box">
            <label for="dob">Date of Birth *</label>
            <input type="date" id="dob" required>
          </div>

          <div class="input-box">
            <label for="gender">Gender *</label>
            <select id="gender" required>
              <option value="" disabled selected>Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <!-- Academic Selection -->
        <div class="form-group-title">Academic Details</div>
        <div class="form-grid">
          <div class="input-box">
            <label for="program">Program Applied For *</label>
            <select id="program" required>
              <option value="" disabled selected>Select Program</option>
              <option value="fsc-pre-medical">F.Sc Pre-Medical</option>
              <option value="fsc-pre-engineering">F.Sc Pre-Engineering</option>
              <option value="ics">ICS (Computer Science)</option>
              <option value="fsc-general-science">General Science</option>
              <option value="arts">I.Com / Arts</option>
            </select>
          </div>

          <div class="input-box">
            <label for="marks">Matric / SSC Marks (%) *</label>
            <input type="number" id="marks" min="0" max="100" placeholder="e.g. 85" required>
          </div>
        </div>

        <!-- Address Details -->
        <div class="form-group-title">Contact Address</div>
        <div class="form-grid full-width">
          <div class="input-box">
            <label for="address">Full Address *</label>
            <input type="text" id="address" placeholder="House #, Street, City" required>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="form-actions">
          <button type="submit" class="submit-btn">Submit Application</button>
        </div>

        <!-- Success Message -->
        <div id="statusMessage" class="status-msg"></div>
      </form>
    </div>
  </section>

  <script src="admission.js"></script>
</body>
</html>
